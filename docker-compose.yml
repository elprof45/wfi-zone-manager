# Démarrage : docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: netpulse_hotspot_manager_db
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do pg_dump --format=custom --file=/backups/netpulse-$$(date +%Y%m%d-%H%M%S).dump && find /backups -type f -mtime +7 -delete; sleep 86400; done"]
    restart: unless-stopped

  # Worker d'arrière-plan autonome (découplage du cron monolithique en production)
  # Pour lancer le worker isolé sans surcharger le serveur web :
  # docker compose run --rm -d --name netpulse_cron_worker ... bun run worker:cron


volumes:
  postgres-data:
    name: netpulse_hotspot_manager_data
  postgres-backups:
    name: netpulse_hotspot_manager_backups

# Démarrage : docker compose up -d
# default user: netpulse_hotspot
# default password: netpulse_hotspot
# database: netpulse_hotspot_db
services:
  postgres:
    image: postgres:16
    container_name: netpulse_hotspot_manager_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netpulse_hotspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netpulse_hotspot}
      POSTGRES_DB: ${POSTGRES_DB:-netpulse_hotspot_db}
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  # Worker d'arrière-plan autonome (découplage du cron monolithique en production)
  # Pour lancer le worker isolé sans surcharger le serveur web :
  # docker compose run --rm -d --name netpulse_cron_worker ... bun run worker:cron


volumes:
  postgres-data:
    name: netpulse_hotspot_manager_data
